// ZenWe in-app updates (Google Play In-App Updates API). Local Expo module, autolinked from ./modules.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.srm.hostelbites'
version = '1.0.0'

android {
  namespace "expo.modules.zenweinappupdate"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.google.android.play:app-update:2.1.0'
}
